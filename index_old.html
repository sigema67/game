<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>復古圖鑑寶可夢對戰</title>
    <style>
        /* 全域與基礎設定 */
        * { box-sizing: border-box; font-family: 'Courier New', Courier, monospace; }
        body { margin: 0; padding: 0; background-color: #222; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #fff; }
        
        /* 圖鑑主體 UI */
        #pokedex { width: 100%; max-width: 500px; background-color: #dc0a2d; border-radius: 15px; border: 8px solid #8b0000; box-shadow: inset -5px -5px 15px rgba(0,0,0,0.3), 5px 5px 20px rgba(0,0,0,0.5); padding: 20px; overflow: hidden; position: relative; }
        
        /* 螢幕顯示區塊 */
        #screen-container { background-color: #dedede; padding: 20px; border-radius: 10px; border: 4px solid #333; margin-bottom: 20px; min-height: 350px; position: relative; }
        #inner-screen { background-color: #2c292c; width: 100%; height: 100%; border-radius: 5px; padding: 15px; display: flex; flex-direction: column; overflow-y: auto; max-height: 320px; }
        
        /* 選擇畫面 */
        #selection-screen { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .poke-card { background-color: #444; border: 2px solid #666; border-radius: 8px; padding: 10px; width: calc(50% - 10px); text-align: center; cursor: pointer; transition: transform 0.1s, background 0.2s; }
        .poke-card:hover { background-color: #666; transform: scale(1.05); }
        .poke-card .type-badge { font-size: 0.8rem; padding: 2px 6px; border-radius: 10px; margin-top: 5px; display: inline-block; }

        /* 戰鬥畫面 */
        #battle-screen { display: none; flex-direction: column; height: 100%; justify-content: space-between; }
        .combatant { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 15px; }
        .combatant.enemy { flex-direction: row-reverse; }
        .sprite { width: 60px; height: 60px; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 1.2rem; border: 3px solid #fff; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        
        /* 血條 UI */
        .status-box { background-color: #f8f8d8; color: #333; padding: 8px; border-radius: 8px; border: 3px solid #555; width: 65%; font-weight: bold; }
        .hp-bar-container { width: 100%; background-color: #555; height: 10px; border-radius: 5px; margin-top: 5px; overflow: hidden; border: 1px solid #333; }
        .hp-bar { height: 100%; width: 100%; transition: width 0.3s ease, background-color 0.3s ease; background-color: #00ff00; }
        
        /* 對戰日誌 */
        #battle-log { background-color: #111; color: #0f0; border: 3px inset #555; padding: 10px; height: 100px; overflow-y: auto; font-size: 0.9rem; line-height: 1.4; border-radius: 5px; margin-bottom: 15px; }
        
        /* 招式按鈕 */
        #controls { display: none; grid-template-columns: 1fr 1fr; gap: 10px; }
        .move-btn { background-color: #fff; color: #333; border: 3px solid #333; border-radius: 8px; padding: 10px; font-weight: bold; font-size: 1rem; cursor: pointer; text-align: left; transition: background 0.2s; box-shadow: 2px 2px 0 #333; }
        .move-btn:hover:not(:disabled) { background-color: #eee; }
        .move-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .move-stats { font-size: 0.7rem; color: #666; display: block; margin-top: 3px; }

        /* 屬性顏色 */
        .bg-water { background-color: #6890f0; color: white;}
        .bg-fire { background-color: #f08030; color: white;}
        .bg-grass { background-color: #78c850; color: white;}
        .bg-electric { background-color: #f8d030; color: #333;}
        .bg-normal { background-color: #a8a878; color: white;}

        /* 小標題 */
        h2 { text-align: center; font-size: 1.2rem; margin-top: 0; color: #f8d030; text-shadow: 1px 1px 0 #333; }
    </style>
</head>
<body>

<div id="pokedex">
    <div id="screen-container">
        <div id="inner-screen">
            <!-- 選擇畫面 -->
            <div id="selection-screen">
                <h2 style="width: 100%;">請選擇你的寶可夢</h2>
                <!-- JS 動態生成寶可夢列表 -->
            </div>

            <!-- 戰鬥畫面 -->
            <div id="battle-screen">
                <!-- AI (上方) -->
                <div class="combatant enemy">
                    <div class="sprite" id="enemy-sprite"></div>
                    <div class="status-box">
                        <div id="enemy-name">???</div>
                        <div style="font-size: 0.8rem; text-align: right;" id="enemy-hp-text">HP: ?/?</div>
                        <div class="hp-bar-container"><div class="hp-bar" id="enemy-hp-bar"></div></div>
                    </div>
                </div>
                
                <!-- 玩家 (下方) -->
                <div class="combatant">
                    <div class="sprite" id="player-sprite"></div>
                    <div class="status-box">
                        <div id="player-name">???</div>
                        <div style="font-size: 0.8rem; text-align: right;" id="player-hp-text">HP: ?/?</div>
                        <div class="hp-bar-container"><div class="hp-bar" id="player-hp-bar"></div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 戰鬥日誌 (初始隱藏) -->
    <div id="battle-log" style="display: none;"></div>

    <!-- 招式控制面板 (初始隱藏) -->
    <div id="controls">
        <button class="move-btn" id="move-0"></button>
        <button class="move-btn" id="move-1"></button>
        <button class="move-btn" id="move-2"></button>
        <button class="move-btn" id="move-3"></button>
    </div>
</div>

<script>
    // 1. 核心圖鑑資料庫 (Pokedex)
    const TYPE_COLORS = { '水': 'bg-water', '火': 'bg-fire', '草': 'bg-grass', '電': 'bg-electric', '普': 'bg-normal' };
    
    // 屬性相剋表 (攻擊方 -> 防禦方 -> 倍率)
    const TYPE_CHART = {
        '水': { '火': 2.0, '水': 0.5, '草': 0.5, '電': 1.0, '普': 1.0 },
        '火': { '草': 2.0, '火': 0.5, '水': 0.5, '電': 1.0, '普': 1.0 },
        '草': { '水': 2.0, '草': 0.5, '火': 0.5, '電': 1.0, '普': 1.0 },
        '電': { '水': 2.0, '電': 0.5, '草': 0.5, '火': 1.0, '普': 1.0 },
        '普': { '水': 1.0, '火': 1.0, '草': 1.0, '電': 1.0, '普': 1.0 }
    };

    class Move {
        constructor(name, type, power, pp, category) {
            this.name = name; this.type = type; this.power = power; 
            this.pp = pp; this.maxPp = pp; this.category = category; // 物理/變化(簡化處理)
        }
    }

    class Pokemon {
        constructor(id, name, type, hp, atk, def, spd, moves, colorCode) {
            this.id = id; this.name = name; this.type = type;
            this.maxHp = hp; this.hp = hp; this.atk = atk; this.def = def; this.spd = spd;
            this.moves = moves; this.colorCode = colorCode; // 簡單的單字代表圖形
        }
        reset() { this.hp = this.maxHp; this.moves.forEach(m => m.pp = m.maxPp); }
    }

    const pokedex = [
        new Pokemon(1, '皮卡丘', '電', 35, 55, 40, 90, [
            new Move('電擊', '電', 40, 30, '物理'), new Move('十萬伏特', '電', 90, 15, '物理'),
            new Move('電光一閃', '普', 40, 30, '物理'), new Move('打雷', '電', 110, 10, '物理')
        ], '皮'),
        new Pokemon(2, '小火龍', '火', 39, 52, 43, 65, [
            new Move('抓', '普', 40, 35, '物理'), new Move('火花', '火', 40, 25, '物理'),
            new Move('噴射火焰', '火', 90, 15, '物理'), new Move('劈開', '普', 70, 20, '物理')
        ], '火'),
        new Pokemon(3, '傑尼龜', '水', 44, 48, 65, 43, [
            new Move('撞擊', '普', 40, 35, '物理'), new Move('水槍', '水', 40, 25, '物理'),
            new Move('咬住', '普', 60, 25, '物理'), new Move('水炮', '水', 110, 5, '物理')
        ], '龜'),
        new Pokemon(4, '妙蛙種子', '草', 45, 49, 49, 45, [
            new Move('藤編', '草', 45, 25, '物理'), new Move('飛葉快刀', '草', 55, 25, '物理'),
            new Move('撞擊', '普', 40, 35, '物理'), new Move('日光束', '草', 120, 10, '物理')
        ], '蛙'),
        new Pokemon(5, '波波', '普', 40, 45, 40, 56, [
            new Move('起風', '普', 40, 35, '物理'), new Move('電光一閃', '普', 40, 30, '物理'),
            new Move('翅膀攻擊', '普', 60, 35, '物理'), new Move('捨身衝撞', '普', 120, 15, '物理')
        ], '波'),
        new Pokemon(6, '伊布', '普', 55, 55, 50, 55, [
            new Move('撞擊', '普', 40, 35, '物理'), new Move('咬住', '普', 60, 25, '物理'),
            new Move('電光一閃', '普', 40, 30, '物理'), new Move('猛撞', '普', 90, 20, '物理')
        ], '伊'),
        new Pokemon(7, '六尾', '火', 38, 41, 40, 65, [
            new Move('火花', '火', 40, 25, '物理'), new Move('電光一閃', '普', 40, 30, '物理'),
            new Move('火焰輪', '火', 60, 25, '物理'), new Move('大字爆炎', '火', 110, 5, '物理')
        ], '六'),
        new Pokemon(8, '可達鴨', '水', 50, 52, 48, 55, [
            new Move('抓', '普', 40, 35, '物理'), new Move('水槍', '水', 40, 25, '物理'),
            new Move('念力', '普', 50, 25, '物理'), new Move('衝浪', '水', 90, 15, '物理')
        ], '鴨'),
        new Pokemon(9, '走路草', '草', 45, 50, 55, 30, [
            new Move('吸取', '草', 20, 25, '物理'), new Move('溶解液', '草', 40, 30, '物理'),
            new Move('飛葉快刀', '草', 55, 25, '物理'), new Move('花瓣舞', '草', 120, 10, '物理')
        ], '草'),
        new Pokemon(10, '小磁怪', '電', 25, 35, 70, 45, [
            new Move('撞擊', '普', 40, 35, '物理'), new Move('電擊', '電', 40, 30, '物理'),
            new Move('電光', '電', 65, 20, '物理'), new Move('打雷', '電', 110, 10, '物理')
        ], '磁')
    ];

    let player = null;
    let enemy = null;
    let isAnimating = false;

    // 初始化選擇畫面
    function init() {
        const selectionScreen = document.getElementById('selection-screen');
        pokedex.forEach((poke, index) => {
            const card = document.createElement('div');
            card.className = 'poke-card';
            card.innerHTML = `
                <div style="font-weight:bold">${poke.name}</div>
                <div class="type-badge ${TYPE_COLORS[poke.type]}">${poke.type}</div>
                <div style="font-size:0.7rem; margin-top:5px">HP:${poke.hp} 攻:${poke.atk} 防:${poke.def} 速:${poke.spd}</div>
            `;
            card.onclick = () => startGame(index);
            selectionScreen.appendChild(card);
        });
    }

    // 進入戰鬥
    function startGame(playerIndex) {
        pokedex.forEach(p => p.reset()); // 重置血量與PP
        player = pokedex[playerIndex];
        
        // AI 隨機盲選
        let enemyIndex;
        do { enemyIndex = Math.floor(Math.random() * pokedex.length); } while (enemyIndex === playerIndex);
        enemy = pokedex[enemyIndex];

        document.getElementById('selection-screen').style.display = 'none';
        document.getElementById('battle-screen').style.display = 'flex';
        document.getElementById('battle-log').style.display = 'block';
        document.getElementById('controls').style.display = 'grid';

        logMsg(`戰鬥開始！野生 ${enemy.name} 出現了！`);
        logMsg(`就決定是你了，${player.name}！`);
        
        updateBattleUI();
        updateMoveButtons();
    }

    function updateBattleUI() {
        // Player UI
        document.getElementById('player-name').innerText = player.name;
        document.getElementById('player-hp-text').innerText = `HP: ${Math.max(0, player.hp)}/${player.maxHp}`;
        document.getElementById('player-sprite').innerText = player.colorCode;
        document.getElementById('player-sprite').className = `sprite ${TYPE_COLORS[player.type]}`;
        updateHPBar('player-hp-bar', player.hp, player.maxHp);

        // Enemy UI
        document.getElementById('enemy-name').innerText = enemy.name;
        document.getElementById('enemy-hp-text').innerText = `HP: ${Math.max(0, enemy.hp)}/${enemy.maxHp}`;
        document.getElementById('enemy-sprite').innerText = enemy.colorCode;
        document.getElementById('enemy-sprite').className = `sprite ${TYPE_COLORS[enemy.type]}`;
        updateHPBar('enemy-hp-bar', enemy.hp, enemy.maxHp);
    }

    function updateHPBar(elementId, currentHp, maxHp) {
        const bar = document.getElementById(elementId);
        const percent = Math.max(0, (currentHp / maxHp) * 100);
        bar.style.width = `${percent}%`;
        
        if (percent > 50) bar.style.backgroundColor = '#00ff00';
        else if (percent > 20) bar.style.backgroundColor = '#ffcc00';
        else bar.style.backgroundColor = '#ff0000';
    }

    function updateMoveButtons() {
        player.moves.forEach((move, i) => {
            const btn = document.getElementById(`move-${i}`);
            btn.innerHTML = `
                ${move.name} 
                <span class="type-badge ${TYPE_COLORS[move.type]}" style="padding:2px 4px; font-size:0.6rem; border-radius:4px; float:right;">${move.type}</span>
                <span class="move-stats">威力:${move.power} PP:${move.pp}/${move.maxPp}</span>
            `;
            btn.disabled = move.pp <= 0 || isAnimating;
            btn.onclick = () => executeTurn(i);
        });
    }

    function logMsg(msg) {
        const logBox = document.getElementById('battle-log');
        const p = document.createElement('div');
        p.innerText = `> ${msg}`;
        p.style.marginBottom = '5px';
        logBox.appendChild(p);
        logBox.scrollTop = logBox.scrollHeight;
    }

    // 核心回合邏輯
    async function executeTurn(playerMoveIndex) {
        if (isAnimating) return;
        isAnimating = true;
        updateMoveButtons(); // 鎖定按鈕

        const playerMove = player.moves[playerMoveIndex];
        playerMove.pp--;

        const enemyMove = getAiMove();
        enemyMove.pp--;

        // 判斷速度決定先後
        let first = player.spd >= enemy.spd ? { p: player, m: playerMove, isPlayer: true } : { p: enemy, m: enemyMove, isPlayer: false };
        let second = player.spd >= enemy.spd ? { p: enemy, m: enemyMove, isPlayer: false } : { p: player, m: playerMove, isPlayer: true };

        // 第一擊
        await attack(first.p, first.isPlayer ? enemy : player, first.m);
        updateBattleUI();

        // 檢查是否倒下
        if (player.hp <= 0 || enemy.hp <= 0) {
            endBattle();
            return;
        }

        await sleep(1000);

        // 第二擊
        await attack(second.p, second.isPlayer ? enemy : player, second.m);
        updateBattleUI();

        if (player.hp <= 0 || enemy.hp <= 0) {
            endBattle();
            return;
        }

        isAnimating = false;
        updateMoveButtons(); // 解鎖按鈕
    }

    // AI 選招邏輯
    function getAiMove() {
        const available = enemy.moves.filter(m => m.pp > 0);
        
        // 基礎AI：若有屬性克制(倍率>1)，提高 60% 機率使用該招
        const superEffective = available.filter(m => TYPE_CHART[m.type][player.type] > 1);
        if (superEffective.length > 0 && Math.random() < 0.6) {
            return superEffective[Math.floor(Math.random() * superEffective.length)];
        }
        
        // 否則隨機
        return available[Math.floor(Math.random() * available.length)];
    }

    // 傷害公式與攻擊執行
    async function attack(attacker, defender, move) {
        logMsg(`${attacker.name} 使用了 ${move.name}！`);
        
        const typeMult = TYPE_CHART[move.type][defender.type];
        const randomRoll = (Math.random() * 0.15) + 0.85; // 0.85 ~ 1.0
        
        let damage = Math.floor(((attacker.atk / defender.def) * move.power * typeMult) * randomRoll);
        if (damage < 1) damage = 1;

        defender.hp -= damage;

        await sleep(500);

        if (typeMult > 1) logMsg(`效果絕佳！`);
        else if (typeMult < 1) logMsg(`效果似乎不太好...`);
        
        logMsg(`造成了 ${damage} 點傷害。`);
    }

    function endBattle() {
        if (player.hp <= 0) {
            logMsg(`你的 ${player.name} 倒下了。你輸了！`);
        } else {
            logMsg(`敵方的 ${enemy.name} 倒下了。你贏了！`);
        }
        
        setTimeout(() => {
            if (confirm('戰鬥結束！是否重新開始？')) {
                location.reload();
            }
        }, 1500);
    }

    // 輔助：延遲函數製造節奏感
    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    // 啟動
    window.onload = init;

</script>
</body>
</html>
